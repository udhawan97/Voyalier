packages:
  - apps/*
  - docs-site
  - packages/*
allowBuilds:
  esbuild: true
overrides:
  # GHSA-w27v-7q3p-w38r / GHSA-4vpr-x523-8j87: complete SVG script removal
  # for namespaced links and embedded HTML in the docs toolchain.
  svgo: 4.1.0
  # GHSA-2883-xcg3-v3hh: bound empty merge-source work as well as !!omap work.
  # The docs toolchain is the only production consumer.
  js-yaml: 4.3.2
  # GHSA-28wg-ghj8-5hjv and GHSA-2v37-7h3g-55p8: nanoid before 3.3.18 can
  # loop indefinitely for invalid generator sizes. Reached through PostCSS.
  nanoid: 3.3.18
  # GHSA-r28c-9q8g-f849 and GHSA-fxqj-rqcc-2cmp: postcss before 8.5.23 can
  # disclose arbitrary .map files via sourceMappingURL auto-loading. Reached
  # only transitively through docs-site > starlight > astro > vite.
  postcss: ">=8.5.23"
minimumReleaseAgeExclude:
  - nanoid@3.3.18
  - prettier@3.9.5
  - vite@8.1.4
