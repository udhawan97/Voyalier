packages:
  - apps/*
  - docs-site
  - packages/*
allowBuilds:
  esbuild: true
overrides:
  # GHSA-w27v-7q3p-w38r / GHSA-4vpr-x523-8j87: complete SVG script removal
  # for namespaced links and embedded HTML in the docs toolchain.
  svgo: 4.1.0
  # GHSA-2883-xcg3-v3hh: bound empty merge-source work as well as !!omap work.
  # The docs toolchain is the only production consumer.
  js-yaml: 4.3.2
  # GHSA-28wg-ghj8-5hjv and GHSA-2v37-7h3g-55p8: nanoid before 3.3.18 can
  # loop indefinitely for invalid generator sizes. Reached through PostCSS.
  nanoid: 3.3.18
  # GHSA-r28c-9q8g-f849 and GHSA-fxqj-rqcc-2cmp: postcss before 8.5.23 can
  # disclose arbitrary .map files via sourceMappingURL auto-loading. Reached
  # only transitively through docs-site > starlight > astro > vite.
  postcss: ">=8.5.23"
  # GHSA-rj75-hqrm-r3gf: the docs-only nested-rule processor must admit
  # patched selector-parser 7.1.6 without changing the Expressive Code release.
  postcss-nested: 7.0.2
  # GHSA-587h-7wmj-h5pm: patch the Windows editor-command path in every
  # web and docs toolchain consumer without changing their declared ranges.
  vite: 8.3.3
  # Keep Vite's required Rolldown cohort at its lowest supported patch so this
  # advisory repair does not also pull in unrelated newer bundler patches.
  "vite@8.3.3>rolldown": 1.2.11
minimumReleaseAgeExclude:
  - nanoid@3.3.18
  - prettier@3.9.5
  - vite@8.1.4
