<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Voyalier system architecture</title>
  <desc id="desc">The shared React interface reaches one AppService through either direct Tauri IPC or a loopback-only Axum server. AppService coordinates the deterministic Rust core, local SQLite and vault storage, and explicit network and keychain seams.</desc>
  <style>
    :root { --paper: oklch(95.6% .017 87); --raised: oklch(98.1% .012 87); --sunken: oklch(92.7% .019 87); --ink: oklch(20.5% .008 78); --muted: oklch(45.5% .012 78); --line: oklch(76% .016 87); --indigo: oklch(43% .055 257); --accent: oklch(55% .16 35); }
    @media (prefers-color-scheme: dark) { :root { --paper: oklch(18.7% .008 78); --raised: oklch(22% .01 78); --sunken: oklch(27% .012 78); --ink: oklch(94.8% .014 87); --muted: oklch(72% .013 87); --line: oklch(35% .012 78); --indigo: oklch(70% .04 257); --accent: oklch(69% .13 35); } }
    .paper { fill: var(--paper); } .card { fill: var(--raised); stroke: var(--line); } .core { fill: var(--sunken); stroke: var(--indigo); stroke-width: 3; }
    .rule { fill: none; stroke: var(--line); stroke-width: 2; } .route { fill: none; stroke: var(--indigo); stroke-width: 4; stroke-linecap: round; }
    .network { fill: none; stroke: var(--accent); stroke-width: 3; stroke-dasharray: 9 11; }
    .dot { fill: var(--accent); } .dot-i { fill: var(--indigo); }
    .label { fill: var(--muted); font: 500 16px "Zen Kaku Gothic New", sans-serif; letter-spacing: .12em; }
    .title { fill: var(--ink); font: 600 31px "Shippori Mincho", serif; }
    .body { fill: var(--muted); font: 400 18px "Zen Kaku Gothic New", sans-serif; }
  </style>
  <rect class="paper" width="1440" height="900" rx="36" />
  <text class="label" x="84" y="62">TWO LOCAL TRANSPORTS · ONE PRODUCT CORE</text><path class="rule" d="M84 88H1356" />
  <g transform="translate(330 126)"><rect class="card" width="780" height="112" rx="24"/><circle class="dot-i" cx="36" cy="36" r="6"/><text class="label" x="58" y="42">SHARED INTERFACE</text><text class="title" x="36" y="88">React + TypeScript workspace</text></g>
  <path class="route" d="M720 238V278M720 278H390V326M720 278H1050V326" />
  <g transform="translate(178 326)"><rect class="card" width="424" height="134" rx="24"/><circle class="dot-i" cx="34" cy="36" r="6"/><text class="label" x="56" y="42">NATIVE DESKTOP</text><text class="title" x="34" y="88">Direct Tauri IPC</text><text class="body" x="34" y="118">No release-mode TCP listener</text></g>
  <g transform="translate(838 326)"><rect class="card" width="424" height="134" rx="24"/><circle class="dot-i" cx="34" cy="36" r="6"/><text class="label" x="56" y="42">BROWSER DEVELOPMENT</text><text class="title" x="34" y="88">Loopback Axum API</text><text class="body" x="34" y="118">127.0.0.1 only · same contract</text></g>
  <path class="route" d="M390 460V504H720M1050 460V504H720V538" />
  <g transform="translate(330 538)"><rect class="core" width="780" height="116" rx="24"/><circle class="dot-i" cx="36" cy="36" r="6"/><text class="label" x="58" y="42">SINGLE FAÇADE</text><text class="title" x="36" y="90">AppService</text><text class="body" x="244" y="89">IO orchestration · persistence · vault · backup</text></g>
  <path class="route" d="M720 654V694M720 694H302V732M720 694V732M720 694H1138V732" />
  <g transform="translate(110 732)"><rect class="core" width="384" height="112" rx="24"/><text class="label" x="30" y="40">DETERMINISTIC</text><text class="title" x="30" y="84">Rust core</text></g>
  <g transform="translate(528 732)"><rect class="card" width="384" height="112" rx="24"/><text class="label" x="30" y="40">LOCAL STATE</text><text class="title" x="30" y="84">SQLite · vault · keychain</text></g>
  <g transform="translate(946 732)"><rect class="card" width="384" height="112" rx="24"/><text class="label" x="30" y="40">EXPLICIT SEAMS</text><text class="title" x="30" y="84">Network · providers</text></g>
  <path class="network" d="M1138 732V688H1296"/><circle class="dot" cx="1296" cy="688" r="7" />
</svg>
