<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc">
  <title id="title">Voyalier evidence pipeline</title>
  <desc id="desc">Untrusted documents produce candidate facts. A traveler review gate alone promotes them to confirmed facts, which deterministic rules use. Connected sources and optional AI remain a separate consented lane.</desc>
  <style>
    :root { --paper: oklch(18.7% .008 78); --raised: oklch(22% .01 78); --raised-2: oklch(27% .012 78); --ink: oklch(94.8% .014 87); --muted: oklch(72% .013 87); --line: oklch(35% .012 78); --indigo: oklch(70% .04 257); --accent: oklch(69% .13 35); }
    .paper { fill: var(--paper); } .card { fill: var(--raised); stroke: var(--line); } .gate { fill: var(--raised-2); stroke: var(--accent); }
    .rule { fill: none; stroke: var(--line); stroke-width: 2; } .trusted { fill: none; stroke: var(--indigo); stroke-width: 4; stroke-linecap: round; }
    .connected { fill: none; stroke: var(--accent); stroke-width: 3; stroke-dasharray: 10 12; stroke-linecap: round; }
    .dot { fill: var(--accent); } .dot-i { fill: var(--indigo); }
    .label { fill: var(--muted); font: 500 16px "Zen Kaku Gothic New", sans-serif; letter-spacing: .12em; }
    .title { fill: var(--ink); font: 600 31px "Shippori Mincho", serif; }
    .body { fill: var(--muted); font: 400 18px "Zen Kaku Gothic New", sans-serif; }
  </style>
  <rect class="paper" width="1440" height="880" rx="36" />
  <text class="label" x="84" y="66">LOCAL EVIDENCE LANE</text>
  <path class="rule" d="M84 92H1356" />
  <g transform="translate(84 150)">
    <rect class="card" width="250" height="178" rx="24" />
    <circle class="dot" cx="30" cy="34" r="6" />
    <text class="label" x="50" y="40">UNTRUSTED</text>
    <text class="title" x="28" y="92">Source</text>
    <text class="body" x="28" y="128">Text · email · HTML</text>
    <text class="body" x="28" y="156">Local file · saved page</text>
  </g>
  <path class="trusted" d="M334 239H408" />
  <g transform="translate(408 150)">
    <rect class="card" width="250" height="178" rx="24" />
    <circle class="dot-i" cx="30" cy="34" r="6" />
    <text class="label" x="50" y="40">PENDING</text>
    <text class="title" x="28" y="92">Candidate</text>
    <text class="body" x="28" y="128">Value + field span</text>
    <text class="body" x="28" y="156">Excerpt + warning</text>
  </g>
  <path class="trusted" d="M658 239H732" />
  <g transform="translate(732 132)">
    <rect class="gate" width="250" height="214" rx="24" />
    <circle class="dot" cx="30" cy="34" r="6" />
    <text class="label" x="50" y="40">HUMAN GATE</text>
    <text class="title" x="28" y="92">Review</text>
    <text class="body" x="28" y="130">Confirm</text>
    <text class="body" x="28" y="160">Edit and confirm</text>
    <text class="body" x="28" y="190">Dismiss or undo</text>
  </g>
  <path class="trusted" d="M982 239H1056" />
  <g transform="translate(1056 150)">
    <rect class="card" width="300" height="178" rx="24" />
    <circle class="dot-i" cx="30" cy="34" r="6" />
    <text class="label" x="50" y="40">TRAVELER-APPROVED</text>
    <text class="title" x="28" y="92">Confirmed fact</text>
    <text class="body" x="28" y="128">Blueprint · checks · Today</text>
    <text class="body" x="28" y="156">Redacted brief · calendar</text>
  </g>
  <text class="label" x="84" y="460">EXPLICIT CONNECTED LANE</text>
  <path class="rule" d="M84 486H1356" />
  <path class="connected" d="M144 610H1296" />
  <g transform="translate(84 542)"><rect class="card" width="286" height="156" rx="24"/><circle class="dot" cx="30" cy="34" r="6"/><text class="label" x="50" y="40">YOU ASK</text><text class="title" x="28" y="91">Fetch</text><text class="body" x="28" y="127">Advice · weather · packs</text></g>
  <g transform="translate(420 542)"><rect class="gate" width="286" height="156" rx="24"/><circle class="dot" cx="30" cy="34" r="6"/><text class="label" x="50" y="40">BOUNDARY</text><text class="title" x="28" y="91">Preview</text><text class="body" x="28" y="127">What leaves · what stays</text></g>
  <g transform="translate(756 542)"><rect class="card" width="286" height="156" rx="24"/><circle class="dot" cx="30" cy="34" r="6"/><text class="label" x="50" y="40">DATED COPY</text><text class="title" x="28" y="91">Store</text><text class="body" x="28" y="127">Source · fetched time · license</text></g>
  <g transform="translate(1092 542)"><rect class="card" width="264" height="156" rx="24"/><circle class="dot-i" cx="30" cy="34" r="6"/><text class="label" x="50" y="40">STILL SEPARATE</text><text class="title" x="28" y="91">Use</text><text class="body" x="28" y="127">Context, never authority</text></g>
  <text class="body" x="84" y="786">No background refresh. No provider output becomes a confirmed fact.</text>
</svg>
