            - button "Fetch destination facts" [ref=f13e524] [cursor=pointer]
            - paragraph [ref=f13e526]: Fetching sends your destination (“Tokyo”) and your origin place name to open-meteo.com to place them on the map, and asks the European Central Bank for today’s reference rates. The time difference, sun, moon, country facts and nearest airports are worked out on this device. Nothing else about your trip leaves it.
