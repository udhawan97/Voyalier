name: Build city packs

# Builds each city pack's contents (Overture places + Wikivoyage prose) from the
# catalog defined in voyalier-core and publishes them as JSON assets on the
# `packs-v1` release, which the app downloads per trip with consent.
#
# Manual only: the underlying data changes slowly and a build hits external
# services (the Overture S3 bucket and the Wikivoyage API), so it should be run
# deliberately rather than on every push.

on:
  workflow_dispatch:
    inputs:
      overture_release:
        # Overture keeps only the newest couple of releases on S3, so this
        # default rots exactly the way the Protomaps one below does — and when
        # it rotted it published packs with zero places for ten days. Check
        # https://overturemaps-us-west-2.s3.amazonaws.com/?list-type=2&prefix=release/&delimiter=/
        # and pass a release that still exists. The build now fails loudly
        # rather than shipping empty packs, but a failed run is still a wasted
        # one.
        description: Overture Maps release to query — pruned often, verify it still exists
        default: "2026-07-22.0"
        type: string
      protomaps_build:
        # Protomaps prunes daily planet builds after about two weeks, and there
        # is no `latest` alias to pin instead. This default therefore goes stale
        # on its own: check https://build.protomaps.com/<YYYYMMDD>.pmtiles
        # resolves before a publish, and pass a recent date if it does not.
        description: Exact Protomaps planet build date (YYYYMMDD) — must be recent; builds are pruned
        default: "20260729"
        type: string

permissions:
  contents: read

concurrency:
  group: build-packs
  cancel-in-progress: true

jobs:
  build:
    name: Build packs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install DuckDB
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/duckdb_cli-linux-amd64.zip"
          curl -fsSL \
            https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip \
            -o "$archive"
          echo "08c0ca117111fcede14239d0093792352befdc174218c344d232c13279643d05  $archive" \
            | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/duckdb"
          unzip -q "$archive" -d "$RUNNER_TEMP/duckdb"
          "$RUNNER_TEMP/duckdb/duckdb" --version | grep -F "v1.5.5"
          echo "$RUNNER_TEMP/duckdb" >> "$GITHUB_PATH"

      - name: Dump the pack catalog (single source of truth)
        run: cargo run --locked -p voyalier-core --example pack_catalog > catalog.json

      - name: Build pack contents
        env:
          PACK_RELEASE_TAG: packs-v1
          OVERTURE_RELEASE: ${{ inputs.overture_release }}
        run: node scripts/build-packs.mjs catalog.json

      - name: Test the pack publishers
        # Also run by scripts/check.sh on every push; kept here so a manual
        # publish never runs a publisher this job has not just exercised.
        run: node --test scripts/build-offline-map.test.mjs scripts/build-packs.test.mjs

      - name: Install pinned PMTiles CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/go-pmtiles.tar.gz"
          curl -fsSL \
            https://github.com/protomaps/go-pmtiles/releases/download/v1.30.0/go-pmtiles_1.30.0_Linux_x86_64.tar.gz \
            -o "$archive"
          echo "429dfa99b6f76fa116b2299a9466bb3811d59aaf1c36c216a41829a2696bee3b  $archive" \
            | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/pmtiles"
          tar -xzf "$archive" -C "$RUNNER_TEMP/pmtiles"
          echo "$RUNNER_TEMP/pmtiles" >> "$GITHUB_PATH"

      - name: Build and verify every catalog-enabled offline basemap slice
        env:
          PROTOMAPS_BUILD: ${{ inputs.protomaps_build }}
        run: node scripts/build-offline-map.mjs catalog.json

      - name: Record pack checksums
        run: (cd dist/packs && sha256sum -- *.json *.pmtiles > SHA256SUMS)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: city-packs
          path: dist/packs/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish packs
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          mkdir -p dist/packs
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/city-packs.zip"
          unzip -q "$RUNNER_TEMP/city-packs.zip" -d dist/packs
          (cd dist/packs && sha256sum --check --strict SHA256SUMS)

      - name: Publish only to the fixed pack prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: packs-v1
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" = true
          else
            gh release create "$RELEASE_TAG" \
              --prerelease \
              --title "City packs ($RELEASE_TAG)" \
              --notes "Overture places (CDLA-Permissive-2.0) + Wikivoyage prose (CC BY-SA 3.0), per pack. Built by .github/workflows/packs.yml."
          fi
          gh release upload "$RELEASE_TAG" \
            dist/packs/*.json dist/packs/*.pmtiles dist/packs/SHA256SUMS \
            --clobber
